[project]
name = "deep-learning-computer-vision"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "cleanvision>=0.3.7",
    "datasets>=5.1.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "peft>=0.21.2",
    "pillow>=13.0.0",
    "timm>=1.0.30",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

# CUDA-Builds von PyTorch nur unter Windows (PyPI hat dort nur CPU-Builds).
# Linux (ML2-Server) und macOS nutzen weiterhin PyPI.
[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cuda", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cuda", marker = "sys_platform == 'win32'" }]

[[tool.mypy.overrides]]
module = ["datasets", "datasets.*"]
ignore_missing_imports = true
